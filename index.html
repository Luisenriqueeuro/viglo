<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida Global</title>
<meta name="theme-color" content="#0b308f">
<meta name="description" content="Del Hogar, al Negocio y el Mundo">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vida Global">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#0b308f}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  #splash img{width:min(60vw,260px);height:auto}
  #splash p{margin:0;font-size:16px}
  #splash a{display:inline-block;margin-top:6px;padding:12px 22px;border-radius:12px;background:#0b308f;color:#fff;text-decoration:none;font-weight:bold;visibility:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-512.png" alt="Vida Global">
  <p id="msg">Abriendo Vida Global…</p>
  <a id="btn" href="#">Abrir la app</a>
</div>
<script src="config.js"></script>
<script>
(function () {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var c = window.VG_CONFIG || {};
  var q = new URLSearchParams(location.search);
  var modo = q.get('modo') || c.MODE || 'directo';
  var url = c.APP_URL;
  var btn = document.getElementById('btn');
  if (!url) { document.getElementById('msg').textContent = 'Falta la liga de la app (config.js).'; return; }
  btn.href = url;
  function directo() { location.replace(url); }
  if (modo === 'iframe') {
    var f = document.createElement('iframe');
    f.src = url;
    f.allow = 'camera; microphone; clipboard-read; clipboard-write; geolocation; fullscreen';
    document.body.appendChild(f);
  } else {
    setTimeout(function () { btn.style.visibility = 'visible'; }, 4000);
    directo();
  }
})();
</script>
</body>
</html>
